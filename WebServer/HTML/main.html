<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARION</title>
</head>

<body>
    <h1>Arion</h1>

    <div class="centered">
        <label>Serial connection</label>
        <label id="serial_connection">xxx</label>
    </div>

    <div class="centered">
        <label>Running since</label>
        <label id="running_since">xxx</label>
    </div>

    <div class="centered">
        <label>Fix</label>
        <label id="fix_date_time">xxx</label>
    </div>

    <div class="centered">
        <label>SOG</label>
        <label id="speed">xxx</label>
    </div>

    <div class="centered">
        <label>Position</label>
        <label id="position">xxx</label>
    </div>

    <div class="centered">
        <label>Satellites</label>
        <label id="satellites">xxx</label>
    </div>

    <div class="centered">
        <label>Height</label>
        <label id="height">xxx</label>
        <label id="height_unit">xxx</label>
    </div>

    <div class="centered">
        <label>Hor. dilution</label>
        <label id="hor_dilution">xxx</label>
    </div>

    <div class="centered">
        <label>Speed through water</label>
        <label id="speed_water">xxx</label>
    </div>

    <div class="centered">
        <label>Water temp.</label>
        <label id="water_temp">xxx</label>
        <label>C</label>
    </div>

    <div class="centered">
        <label>Trip</label>
        <label id="trip">xxx</label>
        <label>nm</label>
    </div>

    <div class="centered">
        <label>Total</label>
        <label id="total">xxx</label>
        <label>nm</label>
    </div>

    <div class="centered">
        <!-- Download is een simpele GET-link (gestyled als knop) -->
        <a href="/download" class="button-style">Download</a>

        <!-- Stop is een actie en blijft een POST-formulier -->
        <form method="POST" action="/stop" style="display:inline;">
            <button type="submit">Stop acquisition</button>
        </form>
    </div>

</body>

</html>
